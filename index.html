<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ---------- Shared space look (used by buttons and the page background) ---------- */

    .space {
      --c1: #000;
      --c2: #000;
      --c3: #000;
      --c4: #000;
      --blur: 6px;
      --stars: 90px 60px;
      --bh: 150px;

      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: var(--c4);
    }

    /* Swirling gas clouds */
    .space::before {
      content: "";
      position: absolute;
      inset: -60%;
      z-index: -2;
      background:
        radial-gradient(ellipse 35% 25% at 30% 40%, var(--c3), transparent 70%),
        radial-gradient(ellipse 40% 30% at 70% 60%, var(--c2), transparent 70%),
        radial-gradient(ellipse 30% 35% at 50% 30%, var(--c1), transparent 70%),
        radial-gradient(ellipse 45% 25% at 25% 75%, var(--c2), transparent 70%),
        radial-gradient(ellipse 25% 20% at 80% 25%, var(--c3), transparent 75%),
        var(--c4);
      filter: blur(var(--blur)) saturate(1.3);
      animation: drift 14s ease-in-out infinite alternate;
    }

    /* Twinkling stars */
    .space::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(1px 1px at 12% 22%, #fff, transparent),
        radial-gradient(1px 1px at 34% 70%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 58% 18%, #fff, transparent),
        radial-gradient(1px 1px at 76% 62%, #fff, transparent),
        radial-gradient(1px 1px at 88% 30%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 22% 85%, #fff, transparent),
        radial-gradient(1px 1px at 66% 88%, #fff, transparent),
        radial-gradient(1px 1px at 46% 45%, #fff, transparent);
      background-size: var(--stars);
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      50%  { transform: translate(-8%, 6%) rotate(8deg) scale(1.1); }
      100% { transform: translate(6%, -5%) rotate(-6deg) scale(1.05); }
    }

    @keyframes twinkle {
      0%   { opacity: 0.35; }
      100% { opacity: 1; }
    }

    /* ---------- Themes ---------- */

    [data-theme="violet"]    { --c1: #3b0f8f; --c2: #7a3cff; --c3: #e0a8ff; --c4: #12052e; --glow: rgba(150, 90, 255, 0.5); }
    [data-theme="ocean"]     { --c1: #0a2a8f; --c2: #1f7bff; --c3: #8fe3ff; --c4: #030b26; --glow: rgba(60, 150, 255, 0.5); }
    [data-theme="magenta"]   { --c1: #7a0a5c; --c2: #ff2fa8; --c3: #ffb3e1; --c4: #22041a; --glow: rgba(255, 60, 170, 0.5); }
    [data-theme="emerald"]   { --c1: #04594a; --c2: #12d18e; --c3: #b4ffd9; --c4: #021a14; --glow: rgba(30, 220, 150, 0.45); }
    [data-theme="ember"]     { --c1: #8a1c05; --c2: #ff5a1f; --c3: #ffd08a; --c4: #240702; --glow: rgba(255, 110, 40, 0.5); }
    [data-theme="aurora"]    { --c1: #0b4f6c; --c2: #f2b632; --c3: #6ff7ff; --c4: #04121c; --glow: rgba(120, 220, 230, 0.45); }
    [data-theme="crimson"]   { --c1: #5c0010; --c2: #d4143a; --c3: #ff8fa3; --c4: #160005; --glow: rgba(230, 30, 70, 0.5); }
    [data-theme="comet"]     { --c1: #1b3a5c; --c2: #7fc4ff; --c3: #f2fbff; --c4: #050d18; --glow: rgba(180, 225, 255, 0.45); }
    [data-theme="supernova"] { --c1: #6b2bd9; --c2: #ffb52e; --c3: #fff6dd; --c4: #120a20; --glow: rgba(255, 200, 90, 0.5); }
    [data-theme="blackhole"] { --c4: #000; --glow: rgba(255, 150, 60, 0.45); }

    /* Black hole: spinning accretion disk with a dark event horizon in the middle */
    [data-theme="blackhole"] {
      background:
        radial-gradient(1px 1px at 15% 25%, #fff, transparent),
        radial-gradient(1px 1px at 80% 70%, #fff, transparent),
        radial-gradient(1px 1px at 60% 15%, #fff, transparent),
        radial-gradient(1px 1px at 30% 80%, #fff, transparent),
        #000;
      background-size: var(--stars);
    }

    [data-theme="blackhole"]::before {
      inset: auto;
      left: 50%;
      top: 50%;
      width: var(--bh);
      height: var(--bh);
      margin: calc(var(--bh) / -2) 0 0 calc(var(--bh) / -2);
      z-index: -1;
      border-radius: 50%;
      background: conic-gradient(#ffb347, #fff1c1, #ff6a00, #7a1f00, #ff9d2e, #ffe3a3, #ff6a00, #5a1500, #ffb347);
      -webkit-mask: radial-gradient(closest-side, transparent 30%, #000 36%, #000 62%, transparent 100%);
      mask: radial-gradient(closest-side, transparent 30%, #000 36%, #000 62%, transparent 100%);
      filter: blur(1px) saturate(1.2);
      animation: spin 6s linear infinite;
    }

    [data-theme="blackhole"]::after {
      inset: auto;
      left: 50%;
      top: 50%;
      width: calc(var(--bh) * 0.3);
      height: calc(var(--bh) * 0.3);
      margin: calc(var(--bh) * -0.15) 0 0 calc(var(--bh) * -0.15);
      z-index: -2;
      border-radius: 50%;
      background: #000;
      background-size: auto;
      box-shadow:
        0 0 0 1.5px rgba(255, 220, 160, 0.95),
        0 0 calc(var(--bh) * 0.08) calc(var(--bh) * 0.03) rgba(255, 150, 60, 0.8),
        0 0 calc(var(--bh) * 0.25) calc(var(--bh) * 0.05) rgba(255, 100, 20, 0.35);
      animation: pulse 4s ease-in-out infinite alternate;
    }

    @keyframes spin {
      from { transform: scaleY(0.3) rotate(0deg); }
      to   { transform: scaleY(0.3) rotate(360deg); }
    }

    @keyframes pulse {
      from { opacity: 0.9; }
      to   { opacity: 1; }
    }

    /* ---------- Page background ---------- */

    #bg {
      position: fixed;
      inset: 0;
      z-index: -10;
      --blur: 40px;
      --stars: 260px 220px;
      --bh: min(90vmin, 900px);
      transition: opacity 0.35s ease;
    }

    #bg.fading {
      opacity: 0;
    }

    /* ---------- Buttons ---------- */

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      row-gap: 56px;
      column-gap: 32px;
      padding: 40px 20px;
    }

    .grid button {
      width: 180px;
      height: 64px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      color: #fff;
      font: 600 15px system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0.04em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.85);
      box-shadow: 0 0 18px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    /* Stagger the motion so the buttons don't move in sync */
    .grid button:nth-child(2)::before { animation-duration: 17s; animation-delay: -4s; }
    .grid button:nth-child(3)::before { animation-duration: 12s; animation-delay: -7s; }
    .grid button:nth-child(4)::before { animation-duration: 19s; animation-delay: -2s; }
    .grid button:nth-child(5)::before { animation-duration: 15s; animation-delay: -9s; }
    .grid button:nth-child(6)::before { animation-duration: 13s; animation-delay: -5s; }
    .grid button:nth-child(7)::before { animation-duration: 16s; animation-delay: -3s; }
    .grid button:nth-child(8)::before { animation-duration: 11s; animation-delay: -6s; }
    .grid button:nth-child(9)::before { animation-duration: 18s; animation-delay: -8s; }
    .grid button:nth-child(even)::after { animation-duration: 2.3s; animation-delay: -1s; }
    .grid button:nth-child(3n)::after { animation-duration: 3.7s; }

    .grid button:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 32px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .grid button:not([data-theme="blackhole"]):hover::before {
      filter: blur(5px) saturate(1.6) brightness(1.2);
    }

    .grid button[aria-pressed="true"] {
      border-color: #fff;
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.35), 0 0 36px var(--glow);
    }

    .grid button:active {
      transform: translateY(0);
    }

    .grid button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .space::before,
      .space::after {
        animation: none !important;
      }
    }

    @media (max-width: 440px) {
      .grid {
        column-gap: 16px;
        row-gap: 40px;
      }

      .grid button {
        width: 42vw;
      }
    }
  </style>
</head>
<body>
  <div id="bg" class="space"></div>

  <div class="grid">
    <button class="space" data-theme="violet">Violet Nebula</button>
    <button class="space" data-theme="ocean">Deep Ocean</button>
    <button class="space" data-theme="magenta">Magenta Cloud</button>
    <button class="space" data-theme="emerald">Emerald Drift</button>
    <button class="space" data-theme="ember">Ember Storm</button>
    <button class="space" data-theme="aurora">Aurora</button>
    <button class="space" data-theme="crimson">Crimson Void</button>
    <button class="space" data-theme="comet">Ice Comet</button>
    <button class="space" data-theme="supernova">Supernova</button>
    <button class="space" data-theme="blackhole">Black Hole</button>
  </div>

  <script>
    const bg = document.getElementById("bg");
    const buttons = document.querySelectorAll(".grid button");

    function setTheme(theme) {
      bg.classList.add("fading");
      setTimeout(() => {
        if (theme) {
          bg.dataset.theme = theme;
        } else {
          delete bg.dataset.theme;
        }
        bg.classList.remove("fading");
      }, 350);

      buttons.forEach((b) => b.setAttribute("aria-pressed", b.dataset.theme === theme));

      try {
        if (theme) localStorage.setItem("theme", theme);
        else localStorage.removeItem("theme");
      } catch (e) {}
    }

    buttons.forEach((button) => {
      button.setAttribute("aria-pressed", "false");
      button.addEventListener("click", () => {
        // Clicking the active theme again goes back to plain black
        setTheme(bg.dataset.theme === button.dataset.theme ? null : button.dataset.theme);
      });
    });

    try {
      const saved = localStorage.getItem("theme");
      if (saved && document.querySelector(`[data-theme="${saved}"]`)) {
        bg.dataset.theme = saved;
        buttons.forEach((b) => b.setAttribute("aria-pressed", b.dataset.theme === saved));
      }
    } catch (e) {}
  </script>
</body>
</html>
