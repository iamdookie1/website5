<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      row-gap: 56px;
      column-gap: 32px;
      padding: 20px;
    }

    /* Each button is a small animated nebula. Colors come from --c1..--c4. */
    .grid button {
      --c1: #2a0a6b;
      --c2: #6a2cff;
      --c3: #c48bff;
      --c4: #120428;
      --glow: rgba(140, 80, 255, 0.45);

      position: relative;
      overflow: hidden;
      isolation: isolate;
      width: 180px;
      height: 64px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 14px;
      background: var(--c4);
      color: #fff;
      font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif;
      box-shadow: 0 0 18px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.15);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    /* Swirling gas clouds */
    .grid button::before {
      content: "";
      position: absolute;
      inset: -60%;
      z-index: -2;
      background:
        radial-gradient(ellipse 35% 25% at 30% 40%, var(--c3), transparent 70%),
        radial-gradient(ellipse 40% 30% at 70% 60%, var(--c2), transparent 70%),
        radial-gradient(ellipse 30% 35% at 50% 30%, var(--c1), transparent 70%),
        radial-gradient(ellipse 45% 25% at 25% 75%, var(--c2), transparent 70%),
        radial-gradient(ellipse 25% 20% at 80% 25%, var(--c3), transparent 75%),
        var(--c4);
      filter: blur(6px) saturate(1.3);
      animation: drift 14s ease-in-out infinite alternate;
    }

    /* Twinkling stars */
    .grid button::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background-image:
        radial-gradient(1px 1px at 12% 22%, #fff, transparent),
        radial-gradient(1px 1px at 34% 70%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 58% 18%, #fff, transparent),
        radial-gradient(1px 1px at 76% 62%, #fff, transparent),
        radial-gradient(1px 1px at 88% 30%, #fff, transparent),
        radial-gradient(1.5px 1.5px at 22% 85%, #fff, transparent),
        radial-gradient(1px 1px at 66% 88%, #fff, transparent),
        radial-gradient(1px 1px at 46% 45%, #fff, transparent);
      animation: twinkle 3s ease-in-out infinite alternate;
    }

    @keyframes drift {
      0%   { transform: translate(0, 0) rotate(0deg) scale(1); }
      50%  { transform: translate(-8%, 6%) rotate(8deg) scale(1.1); }
      100% { transform: translate(6%, -5%) rotate(-6deg) scale(1.05); }
    }

    @keyframes twinkle {
      0%   { opacity: 0.35; }
      100% { opacity: 1; }
    }

    /* Six color themes */
    .grid button:nth-child(1) { /* violet */
      --c1: #3b0f8f; --c2: #7a3cff; --c3: #e0a8ff; --c4: #12052e;
      --glow: rgba(150, 90, 255, 0.5);
    }
    .grid button:nth-child(2) { /* ocean blue */
      --c1: #0a2a8f; --c2: #1f7bff; --c3: #8fe3ff; --c4: #030b26;
      --glow: rgba(60, 150, 255, 0.5);
    }
    .grid button:nth-child(3) { /* magenta */
      --c1: #7a0a5c; --c2: #ff2fa8; --c3: #ffb3e1; --c4: #22041a;
      --glow: rgba(255, 60, 170, 0.5);
    }
    .grid button:nth-child(4) { /* emerald */
      --c1: #04594a; --c2: #12d18e; --c3: #b4ffd9; --c4: #021a14;
      --glow: rgba(30, 220, 150, 0.45);
    }
    .grid button:nth-child(5) { /* ember */
      --c1: #8a1c05; --c2: #ff5a1f; --c3: #ffd08a; --c4: #240702;
      --glow: rgba(255, 110, 40, 0.5);
    }
    .grid button:nth-child(6) { /* teal-gold aurora */
      --c1: #0b4f6c; --c2: #f2b632; --c3: #6ff7ff; --c4: #04121c;
      --glow: rgba(120, 220, 230, 0.45);
    }

    /* Stagger the motion so the buttons don't move in sync */
    .grid button:nth-child(2)::before { animation-duration: 17s; animation-delay: -4s; }
    .grid button:nth-child(3)::before { animation-duration: 12s; animation-delay: -7s; }
    .grid button:nth-child(4)::before { animation-duration: 19s; animation-delay: -2s; }
    .grid button:nth-child(5)::before { animation-duration: 15s; animation-delay: -9s; }
    .grid button:nth-child(6)::before { animation-duration: 13s; animation-delay: -5s; }
    .grid button:nth-child(even)::after { animation-duration: 2.3s; animation-delay: -1s; }
    .grid button:nth-child(3n)::after { animation-duration: 3.7s; }

    .grid button:hover {
      transform: translateY(-3px);
      border-color: rgba(255, 255, 255, 0.4);
      box-shadow: 0 0 32px var(--glow), inset 0 1px 0 rgba(255, 255, 255, 0.25);
    }

    .grid button:hover::before {
      filter: blur(5px) saturate(1.6) brightness(1.2);
    }

    .grid button:active {
      transform: translateY(0);
    }

    .grid button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .grid button::before,
      .grid button::after {
        animation: none;
      }
    }

    @media (max-width: 440px) {
      .grid {
        column-gap: 16px;
        row-gap: 40px;
      }

      .grid button {
        width: 42vw;
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <button></button>
    <button></button>
    <button></button>
    <button></button>
    <button></button>
    <button></button>
  </div>
</body>
</html>
