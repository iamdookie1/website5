<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      row-gap: 56px;
      column-gap: 32px;
      padding: 20px;
    }

    .grid button {
      width: 180px;
      height: 64px;
      border: 1px solid #333;
      border-radius: 14px;
      background: linear-gradient(180deg, #1c1c1c, #0e0e0e);
      color: #fff;
      font: 600 16px system-ui, -apple-system, "Segoe UI", sans-serif;
      box-shadow: 0 4px 14px rgba(255, 255, 255, 0.04), inset 0 1px 0 rgba(255, 255, 255, 0.08);
      cursor: pointer;
      transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
    }

    .grid button:hover {
      transform: translateY(-2px);
      border-color: #666;
      box-shadow: 0 8px 24px rgba(255, 255, 255, 0.08), inset 0 1px 0 rgba(255, 255, 255, 0.12);
    }

    .grid button:active {
      transform: translateY(0);
    }

    .grid button:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    @media (max-width: 440px) {
      .grid {
        column-gap: 16px;
        row-gap: 40px;
      }

      .grid button {
        width: 42vw;
      }
    }
  </style>
</head>
<body>
  <div class="grid">
    <button></button>
    <button></button>
    <button></button>
    <button></button>
    <button></button>
    <button></button>
  </div>
</body>
</html>
